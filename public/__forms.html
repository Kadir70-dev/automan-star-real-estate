<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms definition for the consultation popup. Submissions are posted server-side by /api/leads/consultation. -->
<form name="consultation" data-netlify="true" hidden>
  <input type="text" name="name"><input type="email" name="email"><input type="tel" name="phone">
  <input type="text" name="country"><input type="text" name="interest"><input type="text" name="submitted_at">
  <input type="text" name="source_url"><input type="text" name="consent">
</form>
<!-- General property enquiries: Next.js submits this form server-side after validation. -->
<form name="enquiry" data-netlify="true" hidden>
  <input type="text" name="name"><input type="email" name="email">
  <textarea name="message"></textarea><input type="text" name="property">
  <input type="text" name="submitted_at"><input type="text" name="source_url">
  <input type="text" name="consent">
</form>
</body></html>
