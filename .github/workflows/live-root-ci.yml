name: Live site (root Next.js) CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'netlify.toml'
      - '.github/workflows/live-root-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - 'netlify.toml'
      - '.github/workflows/live-root-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-root:
    name: Typecheck, lint, test, build (live Next.js app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint live app
        run: npx eslint app components lib --quiet

      - name: Test live app
        run: npm test

      - name: Production build
        run: npm run build
