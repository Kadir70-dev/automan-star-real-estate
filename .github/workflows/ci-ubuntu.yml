name: Automan Ubuntu CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regression checks
        run: bash scripts/verify.sh
      - name: Go dependencies and automated tests
        working-directory: backend
        run: |
          go mod tidy
          go test ./...
          go vet ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Next.js production build
        working-directory: frontend
        run: npm run build
      - name: Docker compose and API smoke checks
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: |
          docker compose up --build -d
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/health/ready; then break; fi
            sleep 5
          done
          bash scripts/smoke.sh
      - name: Docker diagnostic logs
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: docker compose ps && docker compose logs --tail=100 || true
      - name: Tear down temporary CI database
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: docker compose down -v || true
