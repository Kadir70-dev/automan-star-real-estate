name: Automan Ubuntu CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regression checks
        run: bash scripts/verify.sh
      - name: Go dependencies and automated tests
        working-directory: backend
        run: |
          go mod tidy
          go test ./...
          go vet ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Next.js production build
        working-directory: frontend
        run: npm run build
      # On the VPS a clean git clone has no backend/go.sum. The Go test
      # step above generates it, accidentally masking a clean Docker build bug.
      - name: Clean-clone Docker build regression (no go.sum)
        run: |
          git restore -- backend/go.mod
          rm -f backend/go.sum
          docker build -f backend/Dockerfile -t automan-backend-clean-checkout:ci backend
      - name: Hostinger production compose configuration is isolated
        env:
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ADMIN_API_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          ALLOWED_ORIGINS: https://automanstarrealty.com,https://www.automanstarrealty.com
        run: |
          docker compose -f deploy/hostinger/compose.yml config -q
          # Ensure only the API is bound, and only on loopback. PostgreSQL/Redis must not publish ports.
          docker compose -f deploy/hostinger/compose.yml config --format json | python3 -c '
          import json,sys
          services=json.load(sys.stdin)["services"]
          assert "ports" not in services["postgres"]
          assert "ports" not in services["redis"]
          ports=services["api"].get("ports",[])
          assert len(ports)==1 and ports[0]["host_ip"]=="127.0.0.1" and ports[0]["target"]==8080
          print("Hostinger compose bind policy PASS")
          '
      - name: Docker compose and API smoke checks
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: |
          docker compose up --build -d
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/health/ready; then break; fi
            sleep 5
          done
          bash scripts/smoke.sh
      - name: Docker diagnostic logs
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: docker compose ps && docker compose logs --tail=100 || true
      - name: Tear down temporary CI database
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-db-password-only
          ADMIN_API_KEY: ci-local-admin-key-only-not-production
        run: docker compose down -v || true
